apiVersion: apps/v1
kind: Deployment
metadata:
  name: merchant-admin
  namespace: merchant-system
  labels:
    app: merchant-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: merchant-admin
  template:
    metadata:
      labels:
        app: merchant-admin
    spec:
      containers:
      - name: merchant-admin
        image: 168787218791.dkr.ecr.ca-central-1.amazonaws.com/merchant-admin:latest
        ports:
        - containerPort: 80
        env:
        - name: REACT_APP_API_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: merchant-config
              key: REACT_APP_API_BASE_URL
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: merchant-admin
  namespace: merchant-system
  labels:
    app: merchant-admin
spec:
  selector:
    app: merchant-admin
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: ClusterIP