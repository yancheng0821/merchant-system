apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-service
  namespace: merchant-system
  labels:
    app: file-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: file-service
  template:
    metadata:
      labels:
        app: file-service
    spec:
      containers:
      - name: file-service
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: shared-storage
          mountPath: /usr/share/nginx/html/files/uploads
        - name: avatars-storage
          mountPath: /usr/share/nginx/html/files
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: nginx.conf
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
      nodeSelector:
        kubernetes.io/hostname: ip-10-0-1-158.ca-central-1.compute.internal
      volumes:
      - name: shared-storage
        persistentVolumeClaim:
          claimName: uploads-pvc
      - name: avatars-storage
        persistentVolumeClaim:
          claimName: avatars-pvc
      - name: nginx-config
        configMap:
          name: file-service-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: file-service-config
  namespace: merchant-system
data:
  nginx.conf: |
    server {
        listen 80;
        server_name localhost;
        
        # 健康检查端点
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        
        # 头像文件访问 - 支持租户目录结构
        location ~ ^/api/files/avatars/(tenant_\d+)/(.+)$ {
            root /usr/share/nginx/html/files;
            try_files /avatars/$1/$2 =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range";
        }
        
        # 房间图标文件访问 - 支持租户目录结构
        location ~ ^/api/files/room-icons/(tenant_\d+)/(.+)$ {
            root /usr/share/nginx/html/files;
            try_files /room-icons/$1/$2 =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range";
        }
        
        # 兼容旧的头像路径
        location /api/files/avatars/ {
            alias /usr/share/nginx/html/files/avatars/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range";
            try_files $uri =404;
        }
        
        # 房间图标路径
        location /api/files/room-icons/ {
            alias /usr/share/nginx/html/files/room-icons/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range";
            try_files $uri =404;
        }
        
        # 上传文件访问
        location /api/files/uploads/ {
            alias /usr/share/nginx/html/files/uploads/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range";
        }
        
        # 默认页面 - 重定向到健康检查
        location / {
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: file-service
  namespace: merchant-system
  labels:
    app: file-service
spec:
  selector:
    app: file-service
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: ClusterIP 