apiVersion: v1
kind: Secret
metadata:
  name: stripe-secrets
  namespace: merchant-system
type: Opaque
stringData:
  # 替换为你的实际Stripe API密钥
  STRIPE_API_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  STRIPE_CLIENT_ID: ""
  # Stripe Terminal Location ID (可选，如果你有固定的Location可以在这里设置)
  #STRIPE_TERMINAL_LOCATION_ID: "tml_GJeGowJums1qGc"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: stripe-config
  namespace: merchant-system
data:
  STRIPE_PLATFORM_FEE_PERCENTAGE: "2.5"
