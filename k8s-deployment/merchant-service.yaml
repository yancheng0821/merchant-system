apiVersion: apps/v1
kind: Deployment
metadata:
  name: merchant-service
  namespace: merchant-system
  labels:
    app: merchant-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: merchant-service
  template:
    metadata:
      labels:
        app: merchant-service
    spec:
      containers:
      - name: merchant-service
        image: 168787218791.dkr.ecr.ca-central-1.amazonaws.com/merchant-service:v1.2.0
        ports:
        - containerPort: 8082
        env:
        - name: TZ
          value: America/Vancouver
        envFrom:
        - configMapRef:
            name: merchant-config
        - secretRef:
            name: merchant-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8082
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8082
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: merchant-service
  namespace: merchant-system
  labels:
    app: merchant-service
spec:
  selector:
    app: merchant-service
  ports:
  - protocol: TCP
    port: 8082
    targetPort: 8082
  type: ClusterIP