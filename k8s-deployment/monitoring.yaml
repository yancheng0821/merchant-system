apiVersion: v1
kind: ServiceMonitor
metadata:
  name: merchant-services-monitor
  namespace: merchant-system
  labels:
    app: merchant-system
spec:
  selector:
    matchLabels:
      monitoring: "true"
  endpoints:
  - port: http
    path: /actuator/prometheus
    interval: 30s
---
# 为每个服务添加监控标签
apiVersion: v1
kind: Service
metadata:
  name: auth-service-monitor
  namespace: merchant-system
  labels:
    app: auth-service
    monitoring: "true"
spec:
  selector:
    app: auth-service
  ports:
  - name: http
    port: 8081
    targetPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: business-service-monitor
  namespace: merchant-system
  labels:
    app: business-service
    monitoring: "true"
spec:
  selector:
    app: business-service
  ports:
  - name: http
    port: 8083
    targetPort: 8083