apiVersion: apps/v1
kind: Deployment
metadata:
  name: business-service
  namespace: merchant-system
  labels:
    app: business-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: business-service
  template:
    metadata:
      labels:
        app: business-service
    spec:
      containers:
      - name: business-service
        image: 168787218791.dkr.ecr.ca-central-1.amazonaws.com/business-service:latest
        ports:
        - containerPort: 8083
        envFrom:
        - configMapRef:
            name: merchant-config
        - secretRef:
            name: merchant-secrets
        env:
        - name: APP_UPLOAD_PATH
          valueFrom:
            configMapKeyRef:
              name: shared-storage-config
              key: SHARED_UPLOAD_PATH
        - name: APP_UPLOAD_URL_PREFIX
          valueFrom:
            configMapKeyRef:
              name: shared-storage-config
              key: SHARED_UPLOAD_URL_PREFIX
        volumeMounts:
        - name: shared-storage
          mountPath: /shared
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8083
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8083
          initialDelaySeconds: 30
          periodSeconds: 10
      nodeSelector:
        kubernetes.io/hostname: ip-10-0-1-158.ca-central-1.compute.internal
      volumes:
      - name: shared-storage
        persistentVolumeClaim:
          claimName: uploads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: business-service
  namespace: merchant-system
  labels:
    app: business-service
spec:
  selector:
    app: business-service
  ports:
  - protocol: TCP
    port: 8083
    targetPort: 8083
  type: ClusterIP