# EFS CSI Driver Storage Class
# 生产环境推荐使用EFS存储方案
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: efs-sc
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
provisioner: efs.csi.aws.com
parameters:
  provisioningMode: efs-ap
  fileSystemId: fs-01d2e5718bb203727  # EFS文件系统ID
  directoryPerms: "700"
  gidRangeStart: "1000"
  gidRangeEnd: "2000"
---
# 共享存储配置
apiVersion: v1
kind: ConfigMap
metadata:
  name: shared-storage-config
  namespace: merchant-system
data:
  SHARED_AVATAR_PATH: "/usr/share/nginx/html/files/avatars"
  SHARED_AVATAR_URL_PREFIX: "/api/files/avatars/"
  SHARED_UPLOAD_PATH: "/shared/uploads"
  SHARED_UPLOAD_URL_PREFIX: "/api/files/uploads/"
---
# Persistent Volume for Avatars
apiVersion: v1
kind: PersistentVolume
metadata:
  name: avatars-pv
  labels:
    type: local
spec:
  storageClassName: efs-sc
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: efs.csi.aws.com
    volumeHandle: fs-01d2e5718bb203727::fsap-006aa67db1635f20b  # EFS文件系统ID和头像访问点ID
    volumeAttributes:
      encryptInTransit: "true"
---
# Persistent Volume Claim for Avatars
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: avatars-pvc
  namespace: merchant-system
spec:
  storageClassName: efs-sc
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  volumeName: avatars-pv
---
# Persistent Volume for Uploads
apiVersion: v1
kind: PersistentVolume
metadata:
  name: uploads-pv
  labels:
    type: local
spec:
  storageClassName: efs-sc
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: efs.csi.aws.com
    volumeHandle: fs-01d2e5718bb203727::fsap-08997e3dd65b3eebd  # EFS文件系统ID和上传文件访问点ID
    volumeAttributes:
      encryptInTransit: "true"
---
# Persistent Volume Claim for Uploads
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads-pvc
  namespace: merchant-system
spec:
  storageClassName: efs-sc
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
  volumeName: uploads-pv 