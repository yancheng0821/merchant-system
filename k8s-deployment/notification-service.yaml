apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: merchant-system
  labels:
    app: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
      - name: notification-service
        image: 168787218791.dkr.ecr.ca-central-1.amazonaws.com/notification-service:latest
        ports:
        - containerPort: 8084
        env:
        - name: SPRING_PROFILES_ACTIVE
          valueFrom:
            configMapKeyRef:
              name: merchant-config
              key: SPRING_PROFILES_ACTIVE
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: merchant-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: merchant-config
              key: DB_PORT
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: merchant-secrets
              key: DB_USERNAME
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: merchant-secrets
              key: DB_PASSWORD
        - name: RABBITMQ_HOST
          valueFrom:
            configMapKeyRef:
              name: merchant-config
              key: RABBITMQ_HOST
        - name: RABBITMQ_PORT
          valueFrom:
            configMapKeyRef:
              name: merchant-config
              key: RABBITMQ_PORT
        - name: RABBITMQ_USERNAME
          valueFrom:
            secretKeyRef:
              name: merchant-secrets
              key: RABBITMQ_USERNAME
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: merchant-secrets
              key: RABBITMQ_PASSWORD
        - name: AWS_REGION
          valueFrom:
            configMapKeyRef:
              name: merchant-config
              key: AWS_REGION
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: merchant-secrets
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: merchant-secrets
              key: AWS_SECRET_ACCESS_KEY
        - name: EMAIL_FROM
          valueFrom:
            configMapKeyRef:
              name: merchant-config
              key: EMAIL_FROM
        - name: EMAIL_FROM_NAME
          valueFrom:
            configMapKeyRef:
              name: merchant-config
              key: EMAIL_FROM_NAME
        - name: AWS_SES_FROM_EMAIL
          valueFrom:
            configMapKeyRef:
              name: merchant-config
              key: AWS_SES_FROM_EMAIL
        - name: AWS_SES_FROM_NAME
          valueFrom:
            configMapKeyRef:
              name: merchant-config
              key: AWS_SES_FROM_NAME
        - name: AWS_SNS_SENDER_ID
          valueFrom:
            configMapKeyRef:
              name: merchant-config
              key: AWS_SNS_SENDER_ID
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8084
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8084
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: merchant-system
  labels:
    app: notification-service
spec:
  selector:
    app: notification-service
  ports:
  - protocol: TCP
    port: 8084
    targetPort: 8084
  type: ClusterIP