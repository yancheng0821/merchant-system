apiVersion: v1
kind: ConfigMap
metadata:
  name: merchant-config
  namespace: merchant-system
data:
  # 数据库配置
  DB_HOST: "merchant-system-mysql.cr88isi8scoc.ca-central-1.rds.amazonaws.com"
  DB_PORT: "3306"
  
  # Redis配置
  REDIS_HOST: "merchant-system-redis.bhima2.0001.cac1.cache.amazonaws.com"
  REDIS_PORT: "6379"
  
  # RabbitMQ配置 (暂时不使用，保留占位符)
  RABBITMQ_HOST: "merchant-rabbitmq.xxx.mq.ca-central-1.amazonaws.com"
  RABBITMQ_PORT: "5672"
  
  # AWS配置
  AWS_REGION: "ca-central-1"
  AWS_MAX_RETRIES: "3"
  AWS_RETRY_DELAY_MS: "1000"
  
  # 邮件配置
  EMAIL_FROM: "yancheng0723@gmail.com"
  EMAIL_FROM_NAME: "商户管理系统"
  AWS_SES_FROM_EMAIL: "yancheng0723@gmail.com"
  AWS_SES_FROM_NAME: "商户管理系统"
  AWS_SNS_SENDER_ID: "Merchant"
  
  # POS配置
  POS_API_URL: "https://pos-api.yourdomain.com"
  POS_TERMINAL_ID: "TERMINAL_001"
  
  # 应用配置 - 直接使用prod profile
  SPRING_PROFILES_ACTIVE: "prod"
  
  # 服务间通信配置 (K8s内部服务发现)
  NOTIFICATION_SERVICE_URL: "http://notification-service:8084"
  MERCHANT_SERVICE_URL: "http://merchant-service:8082"
  BUSINESS_SERVICE_URL: "http://business-service:8083"
  ANALYTICS_SERVICE_URL: "http://analytics-service:8086"
  AUTH_SERVICE_URL: "http://auth-service:8081"
  AI_SERVICE_URL: "http://ai-service:5000"
  
  # 禁用Eureka (使用K8s服务发现)
  EUREKA_CLIENT_ENABLED: "false"
  
  # Google OAuth配置
  GOOGLE_REDIRECT_URI: "https://swiftmerchantplatform.com/auth/google/callback"
  
  # Stripe配置
  STRIPE_REDIRECT_URI: "https://swiftmerchantplatform.com/settings?tab=payment"
  STRIPE_WEBHOOK_URL: "https://api.swiftmerchantplatform.com/api/business/stripe-connect/webhook"
  
  # 前端配置
  REACT_APP_API_BASE_URL: "https://api.swiftmerchantplatform.com"