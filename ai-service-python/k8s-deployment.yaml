apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service-python
  labels:
    app: ai-service-python
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-service-python
  template:
    metadata:
      labels:
        app: ai-service-python
    spec:
      containers:
      - name: ai-service-python
        image: ai-service-python:latest
        ports:
        - containerPort: 5000
        env:
        - name: PORT
          value: "5000"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  labels:
    app: ai-service-python
spec:
  selector:
    app: ai-service-python
  ports:
  - protocol: TCP
    port: 5000
    targetPort: 5000
  type: ClusterIP