  <!-- 屏蔽MetaMask和其他浏览器扩展的错误 -->
  <script>
    (function() {
      'use strict';

      // Store original console methods
      const originalError = console.error;
      const originalWarn = console.warn;

      // Override console.error to filter extension errors
      console.error = function(...args) {
        const errorString = args.join(' ');
        if (errorString.includes('MetaMask') ||
            errorString.includes('chrome-extension') ||
            errorString.includes('moz-extension')) {
          return; // Suppress extension errors
        }
        originalError.apply(console, args);
      };

      // Override console.warn
      console.warn = function(...args) {
        const warnString = args.join(' ');
        if (warnString.includes('MetaMask') ||
            warnString.includes('chrome-extension') ||
            warnString.includes('moz-extension')) {
          return; // Suppress extension warnings
        }
        originalWarn.apply(console, args);
      };

      // Global error handler
      window.addEventListener('error', function(e) {
        if (e.filename && (
            e.filename.indexOf('chrome-extension://') > -1 ||
            e.filename.indexOf('moz-extension://') > -1)) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }

        if (e.message && (
            e.message.indexOf('MetaMask') > -1 ||
            e.message.indexOf('chrome-extension') > -1)) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true); // Use capture phase

      // Promise rejection handler
      window.addEventListener('unhandledrejection', function(e) {
        const reason = e.reason || {};
        const message = reason.message || String(reason);

        if (message.includes('MetaMask') ||
            message.includes('chrome-extension') ||
            message.includes('moz-extension')) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true); // Use capture phase
    })();
  </script>
  <title>Merchant System</title>

</body>
