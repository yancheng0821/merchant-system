server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      globalcors:
        corsConfigurations:
          '[/**]': # 匹配所有路径
            allowedOrigins:
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Content-Type
              - Accept
              - Origin
            allowCredentials: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
        - id: merchant-service
          uri: lb://merchant-service
          predicates:
            - Path=/api/merchant/**
        - id: business-service
          uri: lb://business-service
          predicates:
            - Path=/api/business/**
        - id: ai-service
          uri: http://localhost:5001  # 直接路由到 Python AI 服务
          predicates:
            - Path=/api/ai/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notification/**
        # 注释掉file-service，改用静态资源服务
        # - id: file-service
        #   uri: lb://file-service
        #   predicates:
        #     - Path=/api/files/**
        - id: static-resources
          uri: lb://auth-service
          predicates:
            - Path=/static/uploads/**
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}

# JWT Configuration
jwt:
  secret: merchant-system-jwt-secret-key-2024
  expiration: 86400000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# 日志配置
logging:
  level:
    com.merchant.server.gatewayservice: INFO
    org.springframework.cloud.gateway: WARN
    org.springframework.web: WARN
    org.springframework: WARN
    org.apache.catalina: WARN
    org.apache.coyote: WARN
    org.apache.tomcat: WARN
    root: INFO
