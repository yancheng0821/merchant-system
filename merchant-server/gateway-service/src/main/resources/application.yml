server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    loadbalancer:
      cache:
        ttl: 5s  # 缩短负载均衡器缓存时间，加快服务发现
    gateway:
      discovery:
        locator:
          enabled: true
      globalcors:
        corsConfigurations:
          '[/**]': # 匹配所有路径
            allowedOriginPatterns:
              - "http://localhost:*"
              - "https://*.vamerchant.app"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            exposedHeaders:
              - Authorization
              - Content-Type
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
        - id: merchant-service
          uri: lb://merchant-service
          predicates:
            - Path=/api/merchant/**
        - id: business-service
          uri: lb://business-service
          predicates:
            - Path=/api/business/**
        - id: ai-service
          uri: http://localhost:5001  # 直接路由到 Python AI 服务
          predicates:
            - Path=/api/ai/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notification/**
        - id: analytics-service
          uri: lb://analytics-service
          predicates:
            - Path=/api/analytics/**
        # 公开预约API - 无需认证
        - id: public-booking-api
          uri: lb://business-service
          predicates:
            - Path=/api/public/**
        # 注释掉file-service，改用静态资源服务
        # - id: file-service
        #   uri: lb://file-service
        #   predicates:
        #     - Path=/api/files/**
        - id: static-resources
          uri: lb://auth-service
          predicates:
            - Path=/static/uploads/**
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}

# JWT Configuration
jwt:
  secret: merchant-system-jwt-secret-key-2024
  expiration: 86400000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    registry-fetch-interval-seconds: 5  # 更频繁地刷新服务注册表
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

# 日志配置
logging:
  level:
    com.merchant.server.gatewayservice: INFO
    org.springframework.cloud.gateway: WARN
    org.springframework.web: WARN
    org.springframework: WARN
    org.apache.catalina: WARN
    org.apache.coyote: WARN
    org.apache.tomcat: WARN
    root: INFO
