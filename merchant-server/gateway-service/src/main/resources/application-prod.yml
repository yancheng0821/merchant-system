# 生产环境配置
server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    loadbalancer:
      cache:
        ttl: 5s  # 缩短负载均衡器缓存时间，加快服务发现
    gateway:
      discovery:
        locator:
          enabled: true  # 启用服务发现
          lower-case-service-id: true
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "${FRONTEND_URL:http://localhost:3000}"
              - "https://vamerchant.app"
              - "https://www.vamerchant.app"
              - "https://api.vamerchant.app"
              - "capacitor://localhost"    # iOS Capacitor
              - "ionic://localhost"
              - "http://localhost"         # Android Capacitor WebView
              - "https://localhost"        # Android Capacitor WebView (HTTPS)
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Content-Type
              - Accept
              - Origin
            allowCredentials: true
      routes:
        - id: auth-service
          uri: lb://auth-service  # 通过Eureka负载均衡
          predicates:
            - Path=/api/auth/**
        - id: merchant-service
          uri: lb://merchant-service
          predicates:
            - Path=/api/merchant/**
        - id: business-service
          uri: lb://business-service
          predicates:
            - Path=/api/business/**
        - id: ai-service
          uri: http://localhost:5001  # AI服务直接路由
          predicates:
            - Path=/api/ai/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notification/**
        - id: analytics-service
          uri: lb://analytics-service
          predicates:
            - Path=/api/analytics/**
        # 公开预约API - 无需认证
        - id: public-booking-api
          uri: lb://business-service
          predicates:
            - Path=/api/public/**
        - id: static-resources
          uri: lb://auth-service
          predicates:
            - Path=/static/uploads/**
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:MerchantApp@2024}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:merchant-system-jwt-secret-key-2024}
  expiration: 86400000

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: http://${EUREKA_HOST:eureka-server}:${EUREKA_PORT:8761}/eureka/
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
    appname: ${spring.application.name}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

# Actuator健康检查配置
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# 生产环境日志配置
logging:
  level:
    com.merchant.server.gatewayservice: INFO
    org.springframework.cloud.gateway: WARN
    org.springframework.web: WARN
    org.springframework: WARN
    org.apache.catalina: WARN
    org.apache.coyote: WARN
    org.apache.tomcat: WARN
    root: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /var/log/gateway-service/application.log
    max-size: 100MB
    max-history: 30