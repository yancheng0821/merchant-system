# 生产环境配置
server:
  port: 8084

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/merchant_notification?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:merchant_app}
    password: ${DB_PASSWORD:MerchantApp@2024}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:merchant_app}
    password: ${RABBITMQ_PASSWORD:MerchantApp@2024}
    virtual-host: ${RABBITMQ_VHOST:merchant_vhost}

# MyBatis配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.merchant.server.notificationservice.entity
  configuration:
    map-underscore-to-camel-case: true

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: http://${EUREKA_HOST:eureka-server}:${EUREKA_PORT:8761}/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
    appname: ${spring.application.name}
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

# 生产环境通知服务配置
notification:
  # 生产环境禁用Mock模式
  mock:
    enabled: false # 生产环境设置为false，使用真实的邮件和短信服务
  sms:
    provider: aws # 生产环境使用AWS SNS
    enabled: true
  email:
    provider: aws # 生产环境使用AWS SES
    from: ${EMAIL_FROM:yancheng0723@gmail.com}
    fromName: ${EMAIL_FROM_NAME:VA Merchant}
    enabled: true
  aws:
    region: ${AWS_REGION:ca-central-1}
    # 🔐 生产环境使用IAM Role（推荐）
    # 在EC2/ECS/EKS上运行时，设置为true会自动使用实例/任务/Pod的IAM Role
    # 这样无需管理access key，更安全且不会过期
    useLocalCredentials: true # 使用AWS默认凭证链（包括IAM Role）
    maxRetries: ${AWS_MAX_RETRIES:3} # 最大重试次数
    retryDelayMs: ${AWS_RETRY_DELAY_MS:1000} # 重试间隔（毫秒）
    # 不再需要配置access key - 使用IAM Role
    accessKeyId: ${AWS_ACCESS_KEY_ID:}
    secretAccessKey: ${AWS_SECRET_ACCESS_KEY:}
    ses:
      fromEmail: ${AWS_SES_FROM_EMAIL:notifications@vamerchant.app}
      fromName: ${AWS_SES_FROM_NAME:VA Merchant}
      configurationSetName: ${AWS_SES_CONFIG_SET:}
    sns:
      defaultSenderId: ${AWS_SNS_SENDER_ID:YourApp}
      defaultMessageType: Transactional
  aliyun:
    # 阿里云配置 - 用于中国地区 (+86) 的短信发送
    accessKeyId: ${ALIYUN_ACCESS_KEY_ID}
    accessKeySecret: ${ALIYUN_ACCESS_KEY_SECRET}
    endpoint: dysmsapi.aliyuncs.com
    maxRetries: 3
    retryDelayMs: 1000
    sms:
      signName: 快想科技
      templateCode: SMS_327736525 # 默认验证码模板
      # 场景模板映射 - 阿里云仅支持验证码场景（预约相关因审核限制已禁用）
      sceneTemplates:
        LOGIN_2FA: SMS_327736525  # 登录验证码
        PACKAGE_VERIFICATION: SMS_327736525  # 套餐消费验证
  # Firebase推送配置
  firebase:
    enabled: ${FIREBASE_ENABLED:true}  # 生产环境启用
    # 凭证文件路径 - 需要将Firebase服务账号JSON文件放到服务器上
    credentialsPath: ${FIREBASE_CREDENTIALS_PATH:/etc/merchant/firebase-service-account.json}

# Actuator配置
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# 生产环境日志配置 - 只保留核心业务日志
logging:
  level:
    com.merchant.server.notificationservice: INFO
    com.merchant.server.notificationservice.mq: INFO
    com.merchant.server.notificationservice.processor: INFO
    com.merchant.server.notificationservice.service: INFO
    com.merchant.server.notificationservice.mapper: WARN
    org.apache.ibatis: WARN
    java.sql: WARN
    org.mybatis: WARN
    org.springframework: WARN
    org.apache.catalina: WARN
    org.apache.coyote: WARN
    org.apache.tomcat: WARN
    software.amazon.awssdk: WARN
    software.amazon.awssdk.request: WARN
    software.amazon.awssdk.http: WARN
    root: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /var/log/notification-service/application.log
    max-size: 100MB
    max-history: 30