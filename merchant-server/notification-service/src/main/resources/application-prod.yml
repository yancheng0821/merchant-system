# 生产环境配置
server:
  port: 8084

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:mysql://prod-db-host:3306/merchant_notification?useSSL=true&serverTimezone=America/Vancouver&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: 5672
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

# MyBatis配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.merchant.server.notificationservice.entity
  configuration:
    map-underscore-to-camel-case: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://eureka-server:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# 生产环境通知服务配置
notification:
  # 生产环境禁用Mock模式
  mock:
    enabled: false # 生产环境设置为false，使用真实的邮件和短信服务
  sms:
    provider: aws # 生产环境使用AWS SNS
    enabled: true
  email:
    provider: aws # 生产环境使用AWS SES
    from: ${EMAIL_FROM:yancheng0723@gmail.com}
    fromName: ${EMAIL_FROM_NAME:美容院预约系统}
    enabled: true
  aws:
    region: ${AWS_REGION:us-east-1}
    useLocalCredentials: false # 生产环境使用配置的凭证
    maxRetries: ${AWS_MAX_RETRIES:3} # 最大重试次数
    retryDelayMs: ${AWS_RETRY_DELAY_MS:1000} # 重试间隔（毫秒）
    accessKeyId: ${AWS_ACCESS_KEY_ID}
    secretAccessKey: ${AWS_SECRET_ACCESS_KEY}
    ses:
      fromEmail: ${AWS_SES_FROM_EMAIL:yancheng0723@gmail.com}
      fromName: ${AWS_SES_FROM_NAME:美容院预约系统}
      configurationSetName: ${AWS_SES_CONFIG_SET:}
    sns:
      defaultSenderId: ${AWS_SNS_SENDER_ID:YourApp}
      defaultMessageType: Transactional

# 生产环境日志配置
logging:
  level:
    com.merchant.server.notificationservice: INFO
    com.merchant.server.notificationservice.mapper: WARN
    org.apache.ibatis: WARN
    java.sql: WARN
    org.mybatis: WARN
    org.springframework: WARN
    org.apache.catalina: WARN
    org.apache.coyote: WARN
    org.apache.tomcat: WARN
    software.amazon.awssdk: INFO
    root: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /var/log/notification-service/application.log
    max-size: 100MB
    max-history: 30