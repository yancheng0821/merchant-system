server:
  port: 8084

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:mysql://localhost:3306/merchant_notification?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: merchant_app
    password: MerchantApp@2024
    driver-class-name: com.mysql.cj.jdbc.Driver
  rabbitmq:
    host: localhost
    port: 5672
    username: merchant_app
    password: MerchantApp@2024
    virtual-host: merchant_vhost
    connection-name-strategy: com.merchant.server.notificationservice.config.RabbitMQConnectionNameStrategy
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 3000
          max-attempts: 3
          multiplier: 2
        acknowledge-mode: manual
        concurrency: 3
        max-concurrency: 10


# MyBatis配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.merchant.server.notificationservice.entity
  configuration:
    map-underscore-to-camel-case: true
    default-time-zone: UTC
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 注释掉SQL日志输出

eureka:
  client:
    enabled: true  # 启用Eureka客户端
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# 通知服务配置
notification:
  # Mock模式配置 - 本地开发环境使用
  mock:
    enabled: true # 开启mock模式，不发送真实通知
    sms:
      simulateDelay: true # 模拟发送延迟
      delayMs: 1000 # 模拟延迟时间（毫秒）
      successRate: 1.0 # 模拟成功率（0.0-1.0）- 设为1.0表示100%成功
    email:
      simulateDelay: true
      delayMs: 800
      successRate: 1.0 # 设为1.0表示100%成功
  sms:
    provider: aws # aws, mock
    enabled: true
  email:
    provider: aws # aws, smtp, mock
    from: yancheng0723@gmail.com
    fromName: 美容院预约系统
    enabled: true
    # SMTP配置（备用）
    host: smtp.gmail.com
    port: 587
    username: your-email@gmail.com
    password: your-app-password
    starttlsEnable: true
    auth: true
  aws:
    region: ca-central-1  # 使用加拿大中部区域
    useLocalCredentials: false # 使用本地AWS CLI配置的凭证
    maxRetries: 3 # 最大重试次数
    retryDelayMs: 1000 # 重试间隔（毫秒）
    # 配置你的AWS凭证
    accessKeyId: ${AWS_ACCESS_KEY_ID:your-access-key-id}
    secretAccessKey: ${AWS_SECRET_ACCESS_KEY:your-secret-access-key}
    ses:
      fromEmail: notifications@vamerchant.app
      fromName: VA Merchant
      # configurationSetName: your-configuration-set # 可选
    sns:
      defaultSenderId: YourApp # 可选，短信发送者ID
      defaultMessageType: Transactional # Promotional 或 Transactional
  aliyun:
    # 阿里云配置 - 用于中国地区 (+86) 的短信发送
    # 本地开发环境不配置凭证，使用mock模式
    accessKeyId: ${ALIYUN_ACCESS_KEY_ID:}
    accessKeySecret: ${ALIYUN_ACCESS_KEY_SECRET:}
    endpoint: dysmsapi.aliyuncs.com
    maxRetries: 3
    retryDelayMs: 1000
    sms:
      signName: 快想科技 # 需要在阿里云短信服务中申请
      templateCode: SMS_327736525 # 默认验证码模板：您的验证码为：${code}，请勿泄露于他人！
      # 场景模板映射 - 阿里云仅支持验证码场景（预约相关因审核限制已禁用）
      sceneTemplates:
        LOGIN_2FA: SMS_327736525  # 登录验证码
        PACKAGE_VERIFICATION: SMS_327736525  # 套餐消费验证（使用验证码模板）

# 日志配置 - 只保留核心业务日志
logging:
  level:
    com.merchant.server.notificationservice: INFO
    com.merchant.server.notificationservice.mq: INFO
    com.merchant.server.notificationservice.processor: INFO
    com.merchant.server.notificationservice.service: INFO
    com.merchant.server.notificationservice.mapper: WARN
    org.apache.ibatis: WARN
    java.sql: WARN
    org.mybatis: WARN
    org.springframework: WARN
    org.apache.catalina: WARN
    org.apache.coyote: WARN
    org.apache.tomcat: WARN
    software.amazon.awssdk: WARN
    software.amazon.awssdk.request: WARN
    software.amazon.awssdk.http: WARN
    root: INFO 