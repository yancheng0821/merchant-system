server:
  port: 8084

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:mysql://localhost:3306/merchant_notification?useSSL=false&serverTimezone=America/Vancouver&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

# MyBatis配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.merchant.server.notificationservice.entity
  configuration:
    map-underscore-to-camel-case: true
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 注释掉SQL日志输出

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# 通知服务配置
notification:
  # Mock模式配置 - 开发和测试环境使用
  mock:
    enabled: true # 设置为false时使用真实的邮件和短信服务
    sms:
      simulateDelay: true # 模拟发送延迟
      delayMs: 1000 # 模拟延迟时间（毫秒）
      successRate: 0.95 # 模拟成功率（0.0-1.0）
    email:
      simulateDelay: true
      delayMs: 800
      successRate: 0.98
  sms:
    provider: aws # aws, mock
    enabled: true
  email:
    provider: aws # aws, smtp, mock
    from: noreply@yourcompany.com
    fromName: 美容院预约系统
    enabled: true
    # SMTP配置（备用）
    host: smtp.gmail.com
    port: 587
    username: your-email@gmail.com
    password: your-app-password
    starttlsEnable: true
    auth: true
  aws:
    region: us-east-1
    useLocalCredentials: true # 本地测试时使用AWS CLI配置的凭证
    # 如果不使用本地凭证，请配置以下内容：
    # accessKeyId: your-access-key-id
    # secretAccessKey: your-secret-access-key
    ses:
      fromEmail: noreply@yourcompany.com
      fromName: 美容院预约系统
      # configurationSetName: your-configuration-set # 可选
    sns:
      defaultSenderId: YourApp # 可选，短信发送者ID
      defaultMessageType: Transactional # Promotional 或 Transactional

# 日志配置
logging:
  level:
    com.merchant.server.notificationservice: INFO
    com.merchant.server.notificationservice.mapper: WARN
    org.apache.ibatis: WARN
    java.sql: WARN
    org.mybatis: WARN
    org.springframework: WARN
    org.apache.catalina: WARN
    org.apache.coyote: WARN
    org.apache.tomcat: WARN
    software.amazon.awssdk: INFO
    root: INFO 