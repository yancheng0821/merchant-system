server:
  port: 8085

spring:
  application:
    name: analytics-service
  datasource:
    url: jdbc:mysql://localhost:3306/merchant_analytics?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: localhost
    port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

# 日志配置
logging:
  level:
    com.merchant.server.analyticsservice: INFO
    org.springframework: WARN
    org.hibernate: WARN
    org.apache.catalina: WARN
    org.apache.coyote: WARN
    org.apache.tomcat: WARN
    root: INFO

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# MyBatis配置
mybatis:
  mapper-locations: classpath:mapper/*.xml

analytics:
  cache:
    enabled: true
    ttl: 3600 