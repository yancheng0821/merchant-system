server:
  port: 8086

spring:
  application:
    name: analytics-service
  datasource:
    url: jdbc:mysql://localhost:3306/merchant_analytics?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: merchant_app
    password: MerchantApp@2024
    driver-class-name: com.mysql.cj.jdbc.Driver



# 日志配置
logging:
  level:
    com.merchant.server.analyticsservice: INFO
    org.springframework: WARN
    org.hibernate: WARN
    org.apache.catalina: WARN
    org.apache.coyote: WARN
    org.apache.tomcat: WARN
    root: INFO

eureka:
  client:
    enabled: true  # 启用Eureka客户端
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# MyBatis配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    default-time-zone: UTC

analytics:
  cache:
    enabled: true
    ttl: 3600 