server:
  port: 8084

spring:
  application:
    name: ai-service
  datasource:
    url: jdbc:mysql://localhost:3306/merchant_ai?useSSL=false&serverTimezone=UTC
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false  # 关闭JPA SQL日志
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  redis:
    host: localhost
    port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

# 日志配置
logging:
  level:
    com.merchant.server.aiservice: INFO
    org.springframework: WARN
    org.hibernate: WARN
    org.apache.catalina: WARN
    org.apache.coyote: WARN
    org.apache.tomcat: WARN
    root: INFO

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

ai:
  model:
    cache-enabled: true
    prediction-threshold: 0.8 