# 生产环境配置
server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/merchant_auth?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useLegacyDatetimeCode=false&characterSetResults=utf8&connectionCollation=utf8_unicode_ci&zeroDateTimeBehavior=convertToNull
    username: ${DB_USERNAME:merchant_app}
    password: ${DB_PASSWORD:MerchantApp@2024}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  cloud:
    discovery:
      enabled: true

  # RabbitMQ 配置
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:merchant_app}
    password: ${RABBITMQ_PASSWORD:MerchantApp@2024}
    virtual-host: ${RABBITMQ_VHOST:merchant_vhost}
    connection-name-strategy: com.merchant.server.authservice.config.RabbitMQConnectionNameStrategy
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        retry:
          enabled: true
          initial-interval: 3000
          max-attempts: 3
          max-interval: 10000
          multiplier: 2

  # 国际化配置
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
    use-code-as-default-message: false

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # HTTP编码配置
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.merchant.server.authservice.entity
  configuration:
    map-underscore-to-camel-case: true
    default-time-zone: UTC

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: http://${EUREKA_HOST:eureka-server}:${EUREKA_PORT:8761}/eureka/
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
    appname: ${spring.application.name}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

# Actuator健康检查配置
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

jwt:
  secret: ${JWT_SECRET:merchant-system-jwt-secret-key-2024}
  expiration: 2592000  # 30天（秒）
  refresh-expiration: 5184000  # 60天（秒）

# 前端URL配置
app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}
  password-reset:
    token-validity-hours: 24

# 文件上传配置
file:
  upload:
    path: ${UPLOAD_PATH:/var/uploads}
    max-size: 10485760  # 10MB
    mode: ${FILE_UPLOAD_MODE:s3}  # local, s3, or dual

# AWS S3配置
# 使用EC2 Instance Profile自动获取凭证，无需配置access-key-id和secret-access-key
aws:
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME:}
    region: ${AWS_S3_REGION:ca-central-1}
    url-expiration-hours: 24

# 生产环境日志配置
logging:
  level:
    com.merchant.server.authservice: INFO
    com.merchant.server.authservice.mapper: WARN
    org.apache.ibatis: WARN
    java.sql: WARN
    org.mybatis: WARN
    org.springframework: WARN
    org.springframework.security: WARN
    org.apache.catalina: WARN
    org.apache.coyote: WARN
    org.apache.tomcat: WARN
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /var/log/auth-service/application.log
    max-size: 100MB
    max-history: 30
