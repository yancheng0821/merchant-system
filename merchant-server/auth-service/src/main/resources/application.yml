server:
  port: 8081

spring:
  application:
    name: auth-service
  
  datasource:
    url: jdbc:mysql://localhost:3306/merchant_auth?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useLegacyDatetimeCode=false&characterSetResults=utf8&connectionCollation=utf8_unicode_ci&zeroDateTimeBehavior=convertToNull
    username: merchant_app
    password: MerchantApp@2024
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci
  
  cloud:
    discovery:
      enabled: true

  # RabbitMQ 配置
  rabbitmq:
    host: localhost
    port: 5672
    username: merchant_app
    password: MerchantApp@2024
    virtual-host: merchant_vhost
    connection-name-strategy: com.merchant.server.authservice.config.RabbitMQConnectionNameStrategy
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        retry:
          enabled: true
          initial-interval: 3000
          max-attempts: 3
          max-interval: 10000
          multiplier: 2

  # 国际化配置
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
    use-code-as-default-message: false
  
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  # HTTP编码配置
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.merchant.server.authservice.entity
  configuration:
    map-underscore-to-camel-case: true
    default-time-zone: UTC

eureka:
  client:
    enabled: true  # 启用Eureka客户端
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
    appname: ${spring.application.name}

jwt:
  secret: merchant-system-jwt-secret-key-2024
  expiration: 2592000  # 30天（秒）
  refresh-expiration: 5184000  # 60天（秒）

# 微服务URL配置（本地开发环境）
business-service:
  url: http://localhost:8083

notification-service:
  url: http://localhost:8084

# 前端URL配置
app:
  frontend:
    url: http://localhost:3000
  password-reset:
    token-validity-hours: 24

# 文件上传配置
file:
  upload:
    path: /Users/aisenyc/merchant-system/uploads  # 文件上传根路径（使用项目目录下的永久存储）
    mode: local  # 本地开发环境使用local模式

# AWS S3配置（本地开发不配置，S3Service不会初始化）
# aws:
#   s3:
#     bucket-name:
#     region: ca-central-1

logging:
  level:
    com.merchant.server.authservice: INFO
    com.merchant.server.authservice.mapper: WARN
    org.apache.ibatis: WARN
    java.sql: WARN
    org.mybatis: WARN
    org.springframework: WARN
    org.springframework.security: WARN
    org.apache.catalina: WARN
    org.apache.coyote: WARN
    org.apache.tomcat: WARN
    root: INFO 