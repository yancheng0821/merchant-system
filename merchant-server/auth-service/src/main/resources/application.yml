server:
  port: 8081

spring:
  application:
    name: auth-service
  
  datasource:
    url: jdbc:mysql://localhost:3306/merchant_auth?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=America/Vancouver&allowPublicKeyRetrieval=true&useLegacyDatetimeCode=false&characterSetResults=utf8&connectionCollation=utf8_unicode_ci&zeroDateTimeBehavior=convertToNull
    username: merchant_app
    password: MerchantApp@2024
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci
  
  cloud:
    discovery:
      enabled: true
  
  # 国际化配置
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
    use-code-as-default-message: false
  
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.merchant.server.authservice.entity
  configuration:
    map-underscore-to-camel-case: true
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 注释掉SQL日志输出

eureka:
  client:
    enabled: false  # 禁用Eureka客户端
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: false
    fetch-registry: false
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
    appname: ${spring.application.name}

jwt:
  secret: merchant-system-jwt-secret-key-2024
  expiration: 86400000  # 24小时
  refresh-expiration: 604800000  # 7天

# Google OAuth2 配置
google:
  oauth2:
    client-id: ${GOOGLE_CLIENT_ID:567578445873-v336ul1tb9i08kvvm2vg3mkmoe5cvtfj.apps.googleusercontent.com}
    client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:3000/auth/google/callback}

# 文件上传配置
file:
  upload:
    path: /opt/merchant-system  # 文件上传根路径

logging:
  level:
    com.merchant.server.authservice: INFO
    com.merchant.server.authservice.mapper: WARN
    org.apache.ibatis: WARN
    java.sql: WARN
    org.mybatis: WARN
    org.springframework: WARN
    org.springframework.security: WARN
    org.apache.catalina: WARN
    org.apache.coyote: WARN
    org.apache.tomcat: WARN
    root: INFO 