server:
  port: 8082

spring:
  application:
    name: merchant-service
  datasource:
    url: jdbc:mysql://localhost:3306/merchant_management?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: merchant_app
    password: MerchantApp@2024
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5         # 开发环境较小的连接池
      minimum-idle: 1              # 最小空闲连接数
      connection-timeout: 30000    # 连接超时时间（30秒）
      idle-timeout: 300000         # 空闲连接超时时间（5分钟）
      max-lifetime: 900000         # 连接最大生存时间（15分钟）
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false  # 关闭JPA SQL日志
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.merchant.server.merchantservice.entity
  configuration:
    map-underscore-to-camel-case: true
    default-time-zone: UTC
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 注释掉SQL日志输出

# 日志配置
logging:
  level:
    com.merchant.server.merchantservice: INFO
    com.merchant.server.merchantservice.mapper: WARN
    org.apache.ibatis: WARN
    java.sql: WARN
    org.mybatis: WARN
    org.springframework: WARN
    org.hibernate: WARN
    org.apache.catalina: WARN
    org.apache.coyote: WARN
    org.apache.tomcat: WARN
    root: INFO

eureka:
  client:
    enabled: true  # 启用Eureka客户端
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port} 