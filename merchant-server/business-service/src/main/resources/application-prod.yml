# 生产环境配置
server:
  port: 8083

spring:
  application:
    name: business-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/merchant_business?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:merchant_app}
    password: ${DB_PASSWORD:MerchantApp@2024}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10        # 最大连接数（业务服务需要更多连接）
      minimum-idle: 3              # 最小空闲连接数
      connection-timeout: 30000    # 连接超时时间（30秒）
      idle-timeout: 600000         # 空闲连接超时时间（10分钟）
      max-lifetime: 1800000        # 连接最大生存时间（30分钟）
      leak-detection-threshold: 60000  # 连接泄漏检测阈值（60秒）
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:merchant_app}
    password: ${RABBITMQ_PASSWORD:MerchantApp@2024}
    virtual-host: ${RABBITMQ_VHOST:merchant_vhost}
    connection-name-strategy: com.merchant.server.businessservice.config.RabbitMQConnectionNameStrategy
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        retry:
          enabled: true
          initial-interval: 3000
          max-attempts: 3
          max-interval: 10000
          multiplier: 2

# MyBatis配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.merchant.server.businessservice.entity
  configuration:
    map-underscore-to-camel-case: true
    default-time-zone: UTC

# Eureka配置
eureka:
  client:
    enabled: true
    service-url:
      defaultZone: http://${EUREKA_HOST:eureka-server}:${EUREKA_PORT:8761}/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
    appname: ${spring.application.name}
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

# HTTP客户端配置
http:
  client:
    connect-timeout: 30000  # 30秒连接超时
    read-timeout: 60000     # 60秒读取超时

# 通知服务配置（通过Eureka发现）
notification:
  service:
    url: lb://notification-service

# Actuator配置
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# 日志配置
logging:
  level:
    com.merchant.server.businessservice: INFO
    com.merchant.server.businessservice.mapper: WARN
    org.apache.ibatis: WARN
    java.sql: WARN
    org.mybatis: WARN
    org.springframework: WARN
    org.apache.catalina: WARN
    org.apache.coyote: WARN
    org.apache.tomcat: WARN
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /var/log/business-service/application.log
    max-size: 100MB
    max-history: 30

# 文件上传配置
file:
  upload:
    path: ${APP_UPLOAD_PATH:/shared/uploads}
    url-prefix: ${APP_UPLOAD_URL_PREFIX:/api/files/uploads/}

# POS支付配置 - 生产环境
pos:
  client:
    type: ${POS_CLIENT_TYPE:stripe}  # 可选值: mock, stripe (生产环境默认使用stripe)
  currency: ${POS_CURRENCY:CAD}  # 默认货币，加拿大使用CAD
  mock:
    enabled: false         # 生产环境关闭mock模式
    success-rate: 100      # 生产环境不使用随机成功率
    processing-delay: 1    # 生产环境减少延迟
  # 真实POS配置（根据实际POS提供商配置）
  provider:
    name: "REAL_POS_PROVIDER"
    api-url: "${POS_API_URL}"
    api-key: "${POS_API_KEY}"
    terminal-id: "${POS_TERMINAL_ID}"

# Stripe Connect配置 - 生产环境
stripe:
  api:
    key: ${STRIPE_API_KEY}  # 生产环境必须设置
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET}  # 生产环境必须设置
  platform:
    fee:
      percentage: 2.5      # 平台费用百分比
  connect:
    client:
      id: ${STRIPE_CLIENT_ID}  # 生产环境必须设置
  terminal:
    location:
      id: ${STRIPE_TERMINAL_LOCATION_ID:}  # Stripe Terminal Location ID（可选）
    use-simulator: ${STRIPE_TERMINAL_USE_SIMULATOR:true}  # 在测试模式下使用模拟器