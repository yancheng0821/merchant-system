# 生产环境配置
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/merchant_business?useSSL=true&serverTimezone=America/Vancouver&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10        # 最大连接数（业务服务需要更多连接）
      minimum-idle: 3              # 最小空闲连接数
      connection-timeout: 30000    # 连接超时时间（30秒）
      idle-timeout: 600000         # 空闲连接超时时间（10分钟）
      max-lifetime: 1800000        # 连接最大生存时间（30分钟）
      leak-detection-threshold: 60000  # 连接泄漏检测阈值（60秒）
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

# HTTP客户端配置
http:
  client:
    connect-timeout: 30000  # 30秒连接超时
    read-timeout: 60000     # 60秒读取超时

# 通知服务配置
notification:
  service:
    url: http://notification-service:8084

# Actuator配置
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# 日志配置
logging:
  level:
    root: WARN
    com.merchant.server: INFO

# 文件上传配置
file:
  upload:
    path: ${APP_UPLOAD_PATH:/shared/uploads}
    url-prefix: ${APP_UPLOAD_URL_PREFIX:/api/files/uploads/}

# POS支付配置 - 生产环境
pos:
  client:
    type: ${POS_CLIENT_TYPE:stripe}  # 可选值: mock, stripe (生产环境默认使用stripe)
  currency: ${POS_CURRENCY:CAD}  # 默认货币，加拿大使用CAD
  mock:
    enabled: false         # 生产环境关闭mock模式
    success-rate: 100      # 生产环境不使用随机成功率
    processing-delay: 1    # 生产环境减少延迟
  # 真实POS配置（根据实际POS提供商配置）
  provider:
    name: "REAL_POS_PROVIDER"
    api-url: "${POS_API_URL}"
    api-key: "${POS_API_KEY}"
    terminal-id: "${POS_TERMINAL_ID}"

# Stripe Connect配置 - 生产环境
stripe:
  api:
    key: ${STRIPE_API_KEY}  # 生产环境必须设置
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET}  # 生产环境必须设置
  platform:
    fee:
      percentage: 2.5      # 平台费用百分比
  connect:
    client:
      id: ${STRIPE_CLIENT_ID}  # 生产环境必须设置
  terminal:
    location:
      id: ${STRIPE_TERMINAL_LOCATION_ID:}  # Stripe Terminal Location ID（可选）
    use-simulator: ${STRIPE_TERMINAL_USE_SIMULATOR:true}  # 在测试模式下使用模拟器