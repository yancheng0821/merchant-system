server:
  port: 8083

spring:
  application:
    name: business-service
  datasource:
    url: jdbc:mysql://localhost:3306/merchant_business?useSSL=false&serverTimezone=America/Vancouver&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5         # 开发环境较小的连接池
      minimum-idle: 1              # 最小空闲连接数
      connection-timeout: 30000    # 连接超时时间（30秒）
      idle-timeout: 300000         # 空闲连接超时时间（5分钟）
      max-lifetime: 900000         # 连接最大生存时间（15分钟）
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      enabled: true

# MyBatis配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.merchant.server.businessservice.entity
  configuration:
    map-underscore-to-camel-case: true
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 注释掉SQL日志输出

# 日志配置
logging:
  level:
    com.merchant.server.businessservice.mapper: WARN
    org.apache.ibatis: WARN
    java.sql: WARN
    org.mybatis: WARN
    org.springframework: WARN
    com.merchant.server.businessservice.controller.CustomerImportController: INFO
    com.merchant.server.businessservice.service.impl.CustomerImportServiceImpl: INFO
    root: INFO

eureka:
  client:
    enabled: false  # 禁用Eureka客户端
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# 通知服务配置
notification:
  service:
    # url: http://notification-service  # 使用服务发现名称
    url: http://localhost:8084      # 本地开发时使用直接URL

# 商家信息配置
business:
  name: 美丽人生美容院
  address: 北京市朝阳区三里屯路123号
  phone: 400-123-4567

# POS支付配置
pos:
  mock:
    enabled: true          # 是否启用mock模式
    success-rate: 95       # mock模式下的成功率（百分比）
    processing-delay: 3    # mock处理延迟（秒） 